<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Receptionist Admin</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/js/admin.js" defer></script>
</head>
<body>
  <main>
    <h1>Receptionist Admin</h1>

    <form id="login" class="row">
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" aria-label="Admin key">
      <button type="submit">Sign in</button>
    </form>
    <p id="status" class="status"></p>

    <div id="panel" class="hidden">
      <div class="row">
        <button type="button" id="refresh" class="secondary">Refresh</button>
        <button type="button" id="reload-skills" class="secondary">Reload skills</button>
        <button type="button" id="logout" class="secondary">Sign out</button>
      </div>

      <h2>Questions the agent couldn't answer</h2>
      <p class="note">Write the answer and choose a skill. Once approved, the receptionist uses it straight away.</p>
      <div id="questions"></div>

      <h2>Messages for staff</h2>
      <div id="messages"></div>

      <h2>Approved knowledge</h2>
      <div id="knowledge"></div>

      <h2>Skills</h2>
      <div id="skills"></div>
    </div>
  </main>
</body>
</html>
