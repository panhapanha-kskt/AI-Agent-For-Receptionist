<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Receptionist</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <main class="chat">
    <header>
      <h1>School Receptionist</h1>
      <p class="note">You are talking to an AI assistant. Please don't share sensitive personal information.</p>
      <label>Voice language
        <select id="lang">
          <option value="auto">Auto</option>
          <option value="en">English</option>
          <option value="km">ខ្មែរ (Khmer)</option>
        </select>
      </label>
    </header>

    <ol id="log" class="log" aria-live="polite"></ol>

    <form id="form" class="composer">
      <input id="text" type="text" maxlength="1000" autocomplete="off"
             placeholder="Type a question, or hold the mic to speak..." aria-label="Message">
      <button type="button" id="mic" aria-label="Record voice message">🎤</button>
      <button type="submit">Send</button>
    </form>
    <p id="status" class="status"></p>
  </main>
</body>
</html>
