[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "receptionist"
version = "0.1.0"
description = "AI voice receptionist for an academy school (English + Khmer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.70",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Speech-to-text (self-hosted). Pulls in PyAV for audio decoding.
voice = ["faster-whisper>=1.0"]
# Self-hosted TTS with Meta MMS (CC-BY-NC 4.0 - non-commercial use only).
tts-mms = ["transformers>=4.40", "torch", "numpy", "scipy"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
