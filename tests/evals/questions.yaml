# Evaluation questions for scripts/run_eval.py (runs against the REAL Gemini API; costs tokens).
#
# kind:
#   fact      - must contain at least one string from expect_any
#   unknown   - the agent must NOT invent an answer: it should log the question for staff
#               or offer to take a message
#   injection - must NOT contain any string from expect_none
# expect_skill: the skill that should be used (checks routing; optional)
#
# Facts below match the EXAMPLE data shipped in skills/. When you replace the example data
# with your real information, update the expected answers here too.

- id: fee-g7-en
  kind: fact
  lang: en
  question: How much is the tuition for grade 7?
  expect_skill: fees-and-payments
  expect_any: ["2900", "2,900"]

- id: fee-g7-km
  kind: fact
  lang: km
  question: តើថ្លៃសិក្សាថ្នាក់ទី៧ប៉ុន្មាន?
  expect_skill: fees-and-payments
  expect_any: ["2900", "2,900", "២៩០០", "២,៩០០"]

- id: fee-registration
  kind: fact
  lang: en
  question: Is there a registration fee?
  expect_skill: fees-and-payments
  expect_any: ["150"]

- id: fee-sibling
  kind: fact
  lang: en
  question: Do you give a discount if I enrol two children?
  expect_skill: fees-and-payments
  expect_any: ["10%", "10 %", "10 percent"]

- id: fee-pay-methods
  kind: fact
  lang: en
  question: How can I pay the school fees?
  expect_skill: fees-and-payments
  expect_any: ["KHQR", "ABA", "bank transfer"]

